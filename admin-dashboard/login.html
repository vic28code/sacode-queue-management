<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Sistema Turnero</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
  <div class="login-container">
    <h1>Bienvenido al Sistema Turnero</h1>
    <div class="login-card">
      <label for="usuario" class="input-label">Usuario</label>
      <input type="text" id="usuario" placeholder="Ingrese su usuario" />

      <label for="clave" class="input-label">Contraseña</label>
      <input type="password" id="clave" placeholder="Ingrese su contraseña" />

      <button class="login-btn" onclick="window.location.href='dashboard.html'">Iniciar Sesión</button>
      <span class="forgot">¿Olvidaste tu contraseña?</span>
      <br>
      <label class="input-label">¿Eres usuario nuevo?</label>
      <button class="login-btn" onclick="window.location.href='index.html'">Registrarse</button>
    </div>
  </div>
</body>

</html>
