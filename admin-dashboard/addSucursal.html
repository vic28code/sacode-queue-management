<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar/Editar Sucursal - Sistema Turnero</title>
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./css/sucursales.css">
    <link rel="stylesheet" href="./css/addSucursal.css">
    <link rel="stylesheet" href="./css/kioskos.css">
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            fetch('sidebar.html')
                .then(res => res.text())
                .then(html => {
                    document.getElementById('sidebar-container').innerHTML = html;
                });
        });
    </script>
</head>

<body>
    <div class="layout">
        <aside id="sidebar-container" class="sidebar"></aside>
        <main class="main">
            <h2 style="display: flex; align-items: center; gap: 8px;">
                <span id="nombre-sucursal-text" style="font-size: 1.4em; font-weight: bold; flex: 1;">Sucursal Norte
                </span>
                <input type="text" id="nombre-sucursal-input" value="Sucursal Norte"
                    style="display:none; font-size: 1.4em; font-weight: bold; border: none; background: transparent; width: auto; flex: 1; outline: none; padding: 0; margin: 0;">
                <span class="edit-icon" id="edit-nombre-sucursal" title="Editar nombre" style="cursor:pointer;">&#9998;
                </span>
            </h2>
            <br>
            <form class="sucursal-form">
                <label for="descripcion">Descripción:</label>
                <div class="sucursal-form-group">
                    <input type="text" id="descripcion" placeholder="Defina una breve descripción para esta sucursal"
                        maxlength="160">
                    <div class="limite-texto">Límite de 160 caracteres</div>
                </div>

                <label for="direccion">Dirección:</label>
                <div class="sucursal-form-group grupo-direccion">

                    <input type="text" id="direccion" placeholder="Ingrese la dirección de la sucursal" maxlength="100">

                    <iframe
                        src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d1993.5188873223058!2d-79.97662788392574!3d-2.1391996259160573!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1ses-419!2sec!4v1753811106478!5m2!1ses-419!2sec"
                        width="100%" height="160" style="border:0; border-radius:6px;" allowfullscreen="" loading="lazy"
                        referrerpolicy="no-referrer-when-downgrade"></iframe>

                </div>
                <div class="horarios-row">
                    <div class="horario-col">
                        <label for="hora-apertura">Horario de apertura:</label>
                        <input type="time" id="hora-apertura" value="08:00">
                    </div>
                    <div class="horario-col">
                        <label for="hora-cierre">Horario de cierre:</label>
                        <input type="time" id="hora-cierre" value="17:00">
                    </div>
                </div>
                <label for="buscador-kioskos">Buscar kioskos:</label>
                <div class="sucursal-form-kiosko">

                    <input type="text" id="buscador-kioskos" placeholder="Buscar por nombre o código..." />


                    <select id="filtro-zona">
                        <option value="">Todas las zonas</option>
                        <option value="Centro">Centro</option>
                        <option value="Norte">Norte</option>
                        <option value="Norte">Sur</option>
                    </select>

                    <select id="filtro-categoria">
                        <option value="">Todas las categorías</option>
                        <option value="Servicio al Cliente">Servicio al Cliente</option>
                        <option value="Banca Personas">Banca Personas</option>
                        <option value="Banca Empresas">Banca Empresas</option>
                    </select>
                    <select id="filtro-estado">
                        <option value="">Todas los estados</option>
                        <option value="Servicio al Cliente">Activo</option>
                        <option value="Banca Personas">Inactivo</option>
                        <option value="Banca Empresas">En mantenimiento</option>
                    </select>
                </div>

                <label for="lista-kioskos">Kioskos disponibles:</label>
                <div id="lista-kioskos" class="kiosko-lista">
                    <div class="kiosko-item-button">Kiosko A</div>
                    <div class="kiosko-item-button">Kiosko B</div>
                    <div class="kiosko-item-button">Kiosko C</div>
                    <div class="kiosko-item-button">Kiosko D</div>
                    <div class="kiosko-item-button">Kiosko E</div>
                    <div class="kiosko-item-button">Kiosko F</div>
                    <div class="kiosko-item-button">Kiosko G</div>
                    <div class="kiosko-item-button">Kiosko H</div>
                    <div class="kiosko-item-button">Kiosko I</div>
                    <div class="kiosko-item-button">Kiosko J</div>
                    <div class="kiosko-item-button">Kiosko K</div>
                    <div class="kiosko-item-button">Kiosko L</div>
                    <div class="kiosko-item-button">Kiosko M</div>
                    <div class="kiosko-item-button">Kiosko N</div>
                </div>
                <button class="guardar-btn" type="submit">Guardar cambios</button>
                <br>
    </div>

    </form>
    </main>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            document.querySelectorAll(".kiosko-item-button").forEach(btn => {
                btn.addEventListener("click", () => {
                    btn.classList.toggle("selected");
                });
            });
        });
    </script>

    <script>
        const nombreText = document.getElementById('nombre-sucursal-text');
        const nombreInput = document.getElementById('nombre-sucursal-input');
        const editIcon = document.getElementById('edit-nombre-sucursal');

        editIcon.addEventListener('click', () => {
            nombreInput.value = nombreText.textContent;
            nombreText.style.display = 'none';
            nombreInput.style.display = 'block';
            nombreInput.focus();
            nombreInput.select();
        });

        nombreInput.addEventListener('blur', () => {
            nombreText.textContent = nombreInput.value || 'Sucursal sin nombre';
            nombreInput.style.display = 'none';
            nombreText.style.display = 'block';
        });

        nombreInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                nombreInput.blur();
            }
        });
    </script>
</body>

</html>
