<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro - Sistema Turnero</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <div class="login-container">
    <h1>Registro de Usuario</h1>
    <div class="login-card">
      <label for="nombre" class="input-label">Nombre</label>
      <input type="text" id="nombre" placeholder="Ingrese su nombre" />

      <label for="usuario" class="input-label">Usuario</label>
      <input type="text" id="usuario" placeholder="Cree un nombre de usuario" />

      <label for="clave" class="input-label">Contraseña</label>
      <input type="password" id="clave" placeholder="Cree una contraseña" />

      <button class="login-btn" onclick="mostrarAlerta()">Registrarse</button>
      <span class="forgot" onclick="window.location.href='index.html'">Volver al inicio de sesión</span>
    </div>
  </div>

  <script>
    function mostrarAlerta() {
      alert("¡Registro exitoso! Ahora puedes iniciar sesión.");
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
