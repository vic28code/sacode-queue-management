<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administración de Publicidad</title>
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="stylesheet" href="./css/publicidad.css">
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      fetch('sidebar.html')
        .then(res => res.text())
        .then(html => {
          document.getElementById('sidebar-container').innerHTML = html;
        });
    });
  </script>
</head>

<body>
  <div class="layout">
    <aside id="sidebar-container" class="sidebar"></aside>
    <main class="main">
      <h1><strong>Administración de Publicidad</strong></h1>

      <section class="filters">
        <div class="filter-item">
          <label for="sucursal">Sucursal:</label>
          <select id="sucursal">
            <option value="todas">Todas las sucursales</option>
            <option value="sucursal-norte">Sucursal Norte</option>
            <option value="sucursal-centro">Sucursal Centro</option>
            <option value="sucursal-sur">Sucursal Sur</option>
          </select>
        </div>

        <div class="filter-item">
          <label for="estado">Estado:</label>
          <select id="estado">
            <option value="todos">Todos los estados</option>
            <option value="activo">Activo</option>
            <option value="inactivo">Inactivo</option>
          </select>
        </div>

        <div class="filter-item">
          <label for="prioridad">Nivel de prioridad:</label>
          <select id="prioridad">
            <option value="todos">Todos los niveles</option>
            <option value="alto">Alto</option>
            <option value="medio">Medio</option>
            <option value="bajo">Bajo</option>
          </select>
        </div>

        <button class="btn btn-filter">Filtrar</button>
      </section>

      <section class="advertisements">
        <h2>Publicidad Asignada</h2>
        <div class="advertisement">
          <h3>Sucursal Norte</h3>
          <p>Código: S3</p>
          <p>Horario: 08:00 - 17:00</p>
          <p>Kioskos Asignados: 3</p>
          <button class="btn btn-edit">Editar</button>
        </div>
        <div class="advertisement">
          <h3>Sucursal Centro</h3>
          <p>Código: MATRIZ</p>
          <p>Horario: 09:00 - 18:00</p>
          <p>Kioskos Asignados: 2</p>
          <button class="btn btn-edit">Editar</button>
        </div>
        <div class="advertisement">
          <h3>Sucursal Sur</h3>
          <p>Código: S18</p>
          <p>Horario: 07:30 - 16:30</p>
          <p>Kioskos Asignados: 1</p>
          <button class="btn btn-edit">Editar</button>
        </div>
      </section>
    </main>
  </div>
</body>

</html>
